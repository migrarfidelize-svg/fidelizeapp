<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Fidelize">
  <rect width="64" height="64" rx="14" fill="#7C3AED"/>
  <!-- Return arc: ~300° opening at top-right, ends with arrowhead pointing up-right -->
  <path d="M 28.5 10.5 A 22 22 0 1 0 47.2 16.9" fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round"/>
  <!-- Arrowhead at the arc end, pointing up-right (return metaphor) -->
  <path d="M 43.4 11.6 L 52.4 14.7 L 46.9 22.4 Z" fill="#ffffff"/>
  <!-- F letter (bold, geometric, all rounded) -->
  <g fill="#ffffff">
    <rect x="23.5" y="20" width="5.6" height="24" rx="2.8"/>
    <rect x="23.5" y="20" width="14.5" height="5.6" rx="2.8"/>
    <rect x="23.5" y="28.7" width="11" height="5.4" rx="2.7"/>
  </g>
</svg>
