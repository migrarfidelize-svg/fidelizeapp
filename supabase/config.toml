# Skeleton — preencher com o project_id do DESTINO.
# Nunca commitar valores sensíveis. Ver `.env.migration.example`.

project_id = "REPLACE_WITH_DESTINATION_PROJECT_REF"

[api]
enabled = true
schemas = ["public", "storage"]
extra_search_path = ["public"]

[db]
port = 54322
major_version = 15

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://novo-dominio.exemplo.com"
additional_redirect_urls = [
  "https://novo-dominio.exemplo.com/**",
  "http://localhost:8080/**"
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false  # ajuste conforme política

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = "https://REPLACE_WITH_DESTINATION_PROJECT_REF.supabase.co/auth/v1/callback"
